name: PR Gate

# A PR runs it only when the PR waits for a gate before it merges: every job carries the
# same `if:` (devkit's `sync-devkit.PR_GATE_RUNS_IF`, which `--pull` writes onto a job that
# has no `if:` of its own). On `pull_request` it is true for a bot's PR, a fork's, a
# `release/` branch, one labelled `automerge` or `hold`, or one whose body says
# `Hold: yes`. Every other PR merges as it opens, and the run on main after
# the merge is its check. `labeled` is how a label applied after opening turns it on: a
# money PR (`[delivery] guarded`) is labelled `automerge` by `land.py`, and in the gated
# flow so is every PR `land.py` opens. A run whose jobs all skip concludes `skipped`, and
# nothing reads that as a pass.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # Re-runnable by hand. Cheap to have, and the only way to re-gate a commit whose
  # run was cancelled by the concurrency rule below.
  workflow_dispatch:

# Least privilege. Every job here only reads the repo; a job that needs more must opt
# in with its own `permissions:` block rather than inherit a permissive repo default.
permissions:
  contents: read

# A new push to a PR supersedes the in-flight run for that ref. Keyed on the ref, not
# the workflow alone, so a PR run (refs/pull/N/merge) and a main run
# (refs/heads/main) never cancel each other.
#
# `cancel-in-progress` is deliberately conditional: cancelling a superseded PR run
# saves minutes on a commit nobody will merge, but cancelling a push run would throw
# away the only CI signal that commit will ever get — and the Dependabot merge job
# gates on `workflow_run.conclusion == 'success'`, which a cancelled run never
# reports, so every bot PR would sit unmerged behind a run that was cancelled rather
# than failed.
#
# A main run is keyed on its commit. GitHub keeps one pending run per
# group, so with the ref as the key a burst of merges kept only the newest, and the
# commits between never got the verdict that says which of them broke the branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type == 'Bot' || github.event.pull_request.head.repo.full_name != github.repository || startsWith(github.head_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'automerge') || contains(github.event.pull_request.labels.*.name, 'hold') || contains(github.event.pull_request.body, format('hold:{0}yes', ' ')) }}
    name: Pre-commit gate
    runs-on: ubuntu-latest
    # The hooks `.pre-commit-config.yaml` holds, which nothing runs at a commit: this job
    # is where they are checked, and the tidy job applies the fixers after a merge. Its own job
    # because it clones pinned hook repos and builds their isolated environments — a
    # different failure mode and cache from the lint job.
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
        with:
          # Explicit at every call site: the action is copied from devkit verbatim
          # rather than rendered, so its own default cannot know this project's version.
          python-version: "3.12"
      - name: Run every hook over the whole repo
        # `--all-files` rather than the staged diff: on a push there is no staged diff.
        # NB this includes devkit's `devkit-drift` hook, which byte-compares the vendored
        # harness against the devkit rev pinned in `.pre-commit-config.yaml` — a second,
        # independent check on top of the `devkit-drift` job below, which uses
        # `sync-devkit.py` against the tag pinned in this file. They can disagree, and
        # when they do the two pins have drifted apart, which is worth knowing.
        run: uv run pre-commit run --all-files --show-diff-on-failure

  lint:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type == 'Bot' || github.event.pull_request.head.repo.full_name != github.repository || startsWith(github.head_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'automerge') || contains(github.event.pull_request.labels.*.name, 'hold') || contains(github.event.pull_request.body, format('hold:{0}yes', ' ')) }}
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
        with:
          # Explicit at every call site: the action is copied from devkit verbatim
          # rather than rendered, so its own default cannot know this project's version.
          python-version: "3.12"
      - name: Install dotenv-linter
        # Fail loudly, no `|| true`: `lint-all.py` degrades a missing linter to a
        # terminal note by design, so a silently skipped install here would leave
        # `.env.example` unchecked while the job still reported green for it. The same
        # installer `.claude/hooks/session-start.sh` uses, so the gate and a local
        # session check the same way. The workflow files are actionlint's, which runs
        # from `.pre-commit-config.yaml` in the pre-commit job above.
        run: |
          curl -sSfL https://raw.githubusercontent.com/dotenv-linter/dotenv-linter/master/install.sh \
            | sh -s -- -b /usr/local/bin
      - name: Lint
        run: uv run python scripts/lint-all.py
      - name: Upload lint artifact
        # The filtered artifact, not the raw job log: a raw log buries the real
        # error under container-boot noise and wastes an agent's context.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-errors
          path: logs/lint-errors.log

  test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type == 'Bot' || github.event.pull_request.head.repo.full_name != github.repository || startsWith(github.head_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'automerge') || contains(github.event.pull_request.labels.*.name, 'hold') || contains(github.event.pull_request.body, format('hold:{0}yes', ' ')) }}
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
        with:
          # Explicit at every call site: the action is copied from devkit verbatim
          # rather than rendered, so its own default cannot know this project's version.
          python-version: "3.12"
      - name: Application suite
        id: application-suite
        run: uv run python scripts/run-tests.py
      - name: Harness hook tests
        # Separate from the application suite: pytest's testpaths excludes these,
        # and they are stdlib-only by contract. The JUnit report is their failure
        # artifact: without it a red vendored suite uploads nothing the fix pass can read.
        # They run after a red application suite too, so one gate cycle names both
        # tiers' failures.
        if: success() || steps.application-suite.outcome == 'failure'
        run: uv run python -m pytest scripts/hooks/tests/ -q --junit-xml=logs/junit-hooks.xml
      - name: Upload test artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-failures
          path: |
            logs/test-failures.log
            logs/junit-hooks.xml

  devkit-drift:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type == 'Bot' || github.event.pull_request.head.repo.full_name != github.repository || startsWith(github.head_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'automerge') || contains(github.event.pull_request.labels.*.name, 'hold') || contains(github.event.pull_request.body, format('hold:{0}yes', ' ')) }}
    name: Vendored harness drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # devkit must be checked out AFTER any `git status --porcelain` step in the
      # same job: it lands an untracked directory in the workspace that a
      # working-tree cleanliness check would otherwise report as dirty.
      - name: Check out devkit
        uses: actions/checkout@v7
        with:
          repository: alexandrec90/devkit
          # Pin a tag, never @main — one bad devkit commit must not redden every
          # consuming repo at once.
          ref: v0.11.102
          path: .devkit-src
      # Deliberately NOT `./.github/actions/setup-python-env`: that action syncs the
      # project, and this job has nothing to sync for. `sync-devkit.py` is stdlib-only
      # by contract precisely so the drift check can run before any environment exists,
      # and installing one here would hide a third-party import creeping into it.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Drift check
        # DEVKIT_DIR must be set: it is what the checkout step above exists to provide.
        # Unset, this exits 0 with "nothing to do (skipping)" before the project has
        # pulled — correct, nothing is vendored yet — and fails loudly once DEVKIT_VERSION
        # exists. If the skip line ever appears in this job's log, fix the wiring.
        env:
          DEVKIT_DIR: ${{ github.workspace }}/.devkit-src
        run: python scripts/sync-devkit.py --check

  e2e:
    name: E2E
    # The end-to-end tests a hosted runner can run (`ci_e2e`), through the same
    # `scripts/e2e.py` the PC runs for `local` (`.claude/rules/local-e2e.md`). In this
    # workflow, not one of its own: devkit's fix pass reads a red default branch from the
    # `PR Gate` alone.
    #
    # The default branch only: a PR merges without waiting for a gate, so a PR run of this
    # would decide nothing. After the drift job, whatever it said, so a push run takes one
    # runner fewer at once: the account runs a fixed number of jobs across every repository.
    # A burst of merges collapses to the newest commit; the run it cancels concludes
    # `cancelled`, which the fix pass reads as no verdict, never as a red.
    needs: devkit-drift
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-e2e-${{ github.ref }}
      cancel-in-progress: true
    env:
      # What devkit's scheduler sets for the tier: a skip in it is a failure.
      DEVKIT_E2E: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
        with:
          # Explicit at every call site: the action is copied from devkit verbatim
          # rather than rendered, so its own default cannot know this project's version.
          python-version: "3.12"
      - name: End-to-end tests a runner can run
        run: uv run python scripts/e2e.py --ci
      - name: Upload e2e artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures
          path: logs/e2e-junit.xml
          if-no-files-found: ignore
